services:
  qdrant:
    image: 'qdrant/qdrant:v1.15.4'
    ports:
      - '6333:6333'
      - '6334:6334'

  mysql:
    image: mysql:8.4
    container_name: mysql-saas-pms
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: saas_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_saas_data:/var/lib/mysql

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-saas-pms
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: admin12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_saas_data:/data

volumes:
  mysql_saas_data:
  minio_saas_data: